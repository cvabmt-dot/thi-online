<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Thi Online - TroGiangAI</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; padding-bottom: 90px; }
    .header { background: linear-gradient(135deg, #1d4ed8, #0f172a); padding: 14px 18px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .header h1 { margin: 0; font-size: 16px; color: #fde047; }
    .timer { background: #dc2626; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 17px; font-family: monospace; }
    .container { max-width: 820px; margin: 16px auto; padding: 0 14px; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    input[type="text"] { width: 100%; padding: 11px 12px; margin-top: 6px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
    .btn { background: #16a34a; color: #fff; border: none; padding: 13px 20px; border-radius: 10px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .sec-title { color: #fde047; font-size: 16px; font-weight: bold; margin: 18px 0 10px; }
    .q-title { font-weight: bold; font-size: 15.5px; margin-bottom: 10px; line-height: 1.5; }
    .opt { display: flex; align-items: flex-start; gap: 10px; background: #0f172a; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #334155; cursor: pointer; }
    .opt input { margin-top: 4px; transform: scale(1.2); }
    .tf-row { background: #0f172a; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #334155; }
    .tf-btns { display: flex; gap: 12px; margin-top: 8px; }
    .tf-btns label { flex: 1; text-align: center; padding: 7px; border-radius: 6px; background: #1e293b; border: 1px solid #475569; font-weight: bold; cursor: pointer; }
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; padding: 12px 16px; border-top: 1px solid #334155; display: flex; justify-content: center; }
    .footer-bar .btn { max-width: 820px; }
    .result-card { background: #064e3b; border: 2px solid #10b981; border-radius: 12px; padding: 18px; text-align: center; margin-bottom: 16px; }
    .explain { margin-top: 8px; padding: 8px 10px; background: #172554; border-left: 3px solid #38bdf8; font-size: 14px; color: #bae6fd; border-radius: 4px; }
    .correct-mark { border-color: #22c55e !important; background: #052e16 !important; }
    .wrong-mark { border-color: #ef4444 !important; background: #450a0a !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="examTitle">ĐANG TẢI ĐỀ THI...</h1>
    <div class="timer" id="timerBox">--:--</div>
  </div>

  <div class="container">
    <div id="loadingBox" class="box">⏳ Đang kết nối máy chủ đề thi...</div>

    <div id="loginBox" class="box" style="display:none;">
      <h3 style="margin-top:0; color:#38bdf8;">Thông tin thí sinh</h3>
      <label>Họ và tên học sinh:</label>
      <input type="text" id="inpName" placeholder="Ví dụ: Nguyễn Văn An" />
      <label>Lớp:</label>
      <input type="text" id="inpClass" placeholder="Ví dụ: 12A1" />
      <label>Mã đề (tự điền từ QR):</label>
      <input type="text" id="inpCode" placeholder="Nhập mã đề thầy cung cấp" />
      <button class="btn" onclick="startExam()">🚀 Bắt Đầu Làm Bài</button>
    </div>

    <div id="resultBox" class="result-card" style="display:none;"></div>
    <div id="examContent" style="display:none;"></div>
  </div>

  <div class="footer-bar" id="footerBar" style="display:none;">
    <button class="btn" id="btnSubmit" onclick="submitExam(false)">✅ Nộp Bài & Xem Điểm Ngay</button>
  </div>

  <script>
    const DB_URL = "https://trogiangai-thi-default-rtdb.asia-southeast1.firebasedatabase.app";
    const params = new URLSearchParams(window.location.search);
    const codeFromUrl = (params.get("de") || "").trim();
    document.getElementById("inpCode").value = codeFromUrl;

    let examObj = null;
    let timeLeft = 900;
    let timerId = null;
    let submitted = false;

    window.onload = async () => {
      document.getElementById("loadingBox").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
      if (codeFromUrl) {
        await fetchExam(codeFromUrl);
      } else {
        document.getElementById("examTitle").innerText = "THI ONLINE - TROGIANGAI";
      }
    };

    async function fetchExam(code) {
      try {
        const res = await fetch(`${DB_URL}/exams/${encodeURIComponent(code)}.json`);
        const data = await res.json();
        if (!data || !data.exam_data) {
          alert("Không tìm thấy mã đề: " + code + ". Em hãy kiểm tra lại mã đề!");
          return false;
        }
        examObj = data;
        const m = data.meta || {};
        document.getElementById("examTitle").innerText = `${(m.exam_type || "KIỂM TRA").toUpperCase()} - ${(m.subject || "").toUpperCase()} ${m.grade || ""}`;
        timeLeft = (parseInt(m.duration || 15, 10)) * 60;
        updateTimerText();
        return true;
      } catch (e) {
        alert("Lỗi kết nối mạng: " + e.message);
        return false;
      }
    }

    async function startExam() {
      const name = document.getElementById("inpName").value.trim();
      const cls = document.getElementById("inpClass").value.trim();
      const code = document.getElementById("inpCode").value.trim();
      if (!name || !cls || !code) {
        alert("Em vui lòng nhập đầy đủ Họ tên, Lớp và Mã đề!");
        return;
      }
      if (!examObj || examObj.code !== code) {
        const ok = await fetchExam(code);
        if (!ok) return;
      }
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("examContent").style.display = "block";
      document.getElementById("footerBar").style.display = "flex";
      renderQuestions();
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerText();
        } else {
          clearInterval(timerId);
          submitExam(true);
        }
      }, 1000);
    }

    function updateTimerText() {
      const m = String(Math.floor(timeLeft / 60)).padStart(2, "0");
      const s = String(timeLeft % 60).padStart(2, "0");
      document.getElementById("timerBox").innerText = `⏱️ ${m}:${s}`;
    }

    function renderQuestions() {
      const ed = examObj.exam_data;
      const p1 = ed.phan_1_trac_nghiem || [];
      const p2 = ed.phan_2_dung_sai || [];
      let html = "";

      if (p1.length) {
        html += `<div class="sec-title">PHẦN I. TRẮC NGHIỆM NHIỀU LỰA CHỌN (${p1.length} câu)</div>`;
        p1.forEach((q, idx) => {
          html += `<div class="box" id="p1_card_${idx}">
            <div class="q-title">Câu ${idx + 1}: ${q.cau_hoi || ""}</div>`;
          ["A", "B", "C", "D"].forEach(k => {
            html += `<label class="opt" id="p1_opt_${idx}_${k}">
              <input type="radio" name="p1_${idx}" value="${k}" />
              <span><b>${k}.</b> ${(q.lua_chon || {})[k] || ""}</span>
            </label>`;
          });
          html += `<div class="explain" id="p1_exp_${idx}" style="display:none;"></div></div>`;
        });
      }

      if (p2.length) {
        html += `<div class="sec-title">PHẦN II. TRẮC NGHIỆM ĐÚNG / SAI (${p2.length} câu - Mỗi câu 4 ý)</div>`;
        p2.forEach((q, idx) => {
          html += `<div class="box" id="p2_card_${idx}">
            <div class="q-title">Câu ${idx + 1}: ${q.dan_nhap || ""}</div>`;
          (q.cac_y || []).forEach((y, yIdx) => {
            html += `<div class="tf-row" id="p2_row_${idx}_${yIdx}">
              <div><b>${y.ky_hieu})</b> ${y.noi_dung || ""}</div>
              <div class="tf-btns">
                <label><input type="radio" name="p2_${idx}_${yIdx}" value="D" /> Đúng</label>
                <label><input type="radio" name="p2_${idx}_${yIdx}" value="S" /> Sai</label>
              </div>
            </div>`;
          });
          html += `<div class="explain" id="p2_exp_${idx}" style="display:none;"></div></div>`;
        });
      }

      document.getElementById("examContent").innerHTML = html;
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
    }

    async function submitExam(isAuto) {
      if (submitted) return;
      if (!isAuto && !confirm("Em chắc chắn muốn nộp bài ngay bây giờ?")) return;
      submitted = true;
      clearInterval(timerId);
      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      btn.innerText = "⏳ Đang chấm và gửi điểm...";

      const ed = examObj.exam_data;
      const p1 = ed.phan_1_trac_nghiem || [];
      const p2 = ed.phan_2_dung_sai || [];
      let c1 = 0;

      p1.forEach((q, idx) => {
        const chosen = document.querySelector(`input[name="p1_${idx}"]:checked`);
        const val = chosen ? chosen.value : "";
        const ans = q.dap_an || "";
        if (val === ans) c1++;
        const ansEl = document.getElementById(`p1_opt_${idx}_${ans}`);
        if (ansEl) ansEl.classList.add("correct-mark");
        if (val && val !== ans) {
          const wEl = document.getElementById(`p1_opt_${idx}_${val}`);
          if (wEl) wEl.classList.add("wrong-mark");
        }
        const expEl = document.getElementById(`p1_exp_${idx}`);
        expEl.style.display = "block";
        expEl.innerHTML = `<b>Đáp án đúng: ${ans}</b>${q.giai_thich ? " — " + q.giai_thich : ""}`;
      });

      const tfPts = [0.0, 0.1, 0.25, 0.5, 1.0];
      let c2Raw = 0;
      p2.forEach((q, idx) => {
        let rightCnt = 0;
        let expLines = [];
        (q.cac_y || []).forEach((y, yIdx) => {
          const chosen = document.querySelector(`input[name="p2_${idx}_${yIdx}"]:checked`);
          const val = chosen ? chosen.value : "";
          const isTrue = !!y.dap_an_dung;
          const ok = (val === "D" && isTrue) || (val === "S" && !isTrue);
          const rowEl = document.getElementById(`p2_row_${idx}_${yIdx}`);
          if (ok) {
            rightCnt++;
            rowEl.classList.add("correct-mark");
          } else {
            rowEl.classList.add("wrong-mark");
          }
          expLines.push(`${y.ky_hieu}) <b>${isTrue ? "Đúng" : "Sai"}</b>${y.giai_thich ? " (" + y.giai_thich + ")" : ""}`);
        });
        c2Raw += tfPts[rightCnt];
        const expEl = document.getElementById(`p2_exp_${idx}`);
        expEl.style.display = "block";
        expEl.innerHTML = expLines.join("<br/>");
      });

      const p1Max = p2.length ? 6.0 : 10.0;
      const p2Max = p2.length ? 4.0 : 0.0;
      const s1 = p1.length ? (c1 / p1.length) * p1Max : 0;
      const s2 = p2.length ? (c2Raw / p2.length) * p2Max : 0;
      const totalScore = Math.round((s1 + s2) * 100) / 100;

      const payload = {
        ho_ten: document.getElementById("inpName").value.trim(),
        lop: document.getElementById("inpClass").value.trim().toUpperCase(),
        diem: totalScore,
        phan_1_dung: `${c1}/${p1.length}`,
        phan_2_diem: Math.round(s2 * 100) / 100,
        thoi_gian_nop: new Date().toLocaleString("vi-VN")
      };

      const code = document.getElementById("inpCode").value.trim();
      try {
        await fetch(`${DB_URL}/results/${encodeURIComponent(code)}.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (e) {}

      document.getElementById("footerBar").style.display = "none";
      const resBox = document.getElementById("resultBox");
      resBox.style.display = "block";
      resBox.innerHTML = `
        <h2 style="margin:0 0 8px; color:#6ee7b7;">🎉 ĐÃ NỘP BÀI THÀNH CÔNG!</h2>
        <div style="font-size:28px; font-weight:bold; color:#fde047;">ĐIỂM SỐ: ${totalScore} / 10</div>
        <p style="margin:8px 0 0;">Thí sinh: <b>${payload.ho_ten}</b> — Lớp: <b>${payload.lop}</b><br/>
        Phần I: Đúng <b>${c1}/${p1.length}</b> câu | Phần II: Đạt <b>${payload.phan_2_diem}/${p2Max}</b> điểm</p>
        <p style="font-size:13px; color:#a7f3d0; margin-bottom:0;">Kéo xuống dưới để xem đáp án và lời giải chi tiết từng câu.</p>
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
    }
  </script>
</body>
</html>
